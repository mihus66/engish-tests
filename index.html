<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Trainer</title>
    <style>
        :root {
            --primary: #4a90e2;
            --primary-hover: #357abd;
            --bg: #f5f7fa;
            --card-bg: #ffffff;
            --text: #333333;
            --success: #2ecc71;
            --error: #e74c3c;
            --muted: #888888;
            --border: #e1e9f0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 750px;
        }

        header {
            text-align: center;
            margin-bottom: 25px;
        }

        h1 { color: var(--primary); margin-bottom: 5px; font-size: 28px; }
        .subtitle { color: #666; margin-top: 0; font-size: 15px; }

        /* Навигация 1 уровня (Модули) */
        .main-nav {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-bottom: 20px;
        }

        .mod-btn {
            background: var(--card-bg);
            border: 2px solid var(--border);
            color: #555;
            padding: 12px 24px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 16px;
            transition: all 0.3s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .mod-btn.active {
            border-color: var(--primary);
            color: var(--primary);
            background: #eef5fc;
        }

        /* Навигация 2 уровня (Разделы) */
        .sections-container {
            background: var(--card-bg);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 25px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            display: none;
        }
        .sections-container.active { display: block; }
        
        .sections-title {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .sections-list {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .sec-btn {
            background: #f0f4f8;
            border: none;
            color: #444;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: all 0.2s;
        }
        .sec-btn:hover { background: #e1e9f0; }
        .sec-btn.active { background: var(--primary); color: white; }
        .sec-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        /* Основная карточка тренажера */
        .trainer-card {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            display: none;
        }
        .trainer-card.active { display: block; }

        /* Информационный экран приветствия */
        .welcome-screen {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .welcome-screen.hidden { display: none; }

        /* Элементы вопроса внутри карточки */
        .status-bar {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 20px;
            border-bottom: 1px solid #f0f4f8;
            padding-bottom: 10px;
        }

        .sentence-box {
            font-size: 18px;
            line-height: 1.6;
            margin-bottom: 25px;
            color: #222;
        }

        .word-badge {
            background: #eef5fc;
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 16px;
        }

        .input-answer {
            width: 100%;
            padding: 14px;
            font-size: 16px;
            border: 2px solid #ccc;
            border-radius: 8px;
            box-sizing: border-box;
            margin-bottom: 20px;
            outline: none;
            transition: all 0.2s;
        }
        .input-answer:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(74,144,226,0.1); }
        .input-answer.correct { border-color: var(--success); background: #eafaf1; color: #1e7e34; font-weight: bold; }
        .input-answer.wrong { border-color: var(--error); background: #fdedec; color: #bd2130; font-weight: bold; }

        .action-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            transition: background 0.2s;
        }
        .action-btn:hover { background: var(--primary-hover); }

        .feedback {
            margin-top: 20px;
            font-weight: bold;
            font-size: 16px;
        }
        .feedback.correct { color: var(--success); }
        .feedback.wrong { color: var(--error); }

        /* Экран финальных результатов */
        .results-screen { text-align: center; }
        .score-num { font-size: 54px; color: var(--primary); font-weight: bold; margin: 15px 0; }
    </style>
</head>

    <div id="welcome-screen" class="welcome-screen">

let isAnswered = false;
// Переключение модулей (Уровень 1)
function selectModule(modNum) {
// Управление кнопками модулей
document.querySelectorAll('.mod-btn').forEach(btn => btn.classList.remove('active'));
document.getElementById(mod-btn-${modNum}).classList.add('active');
// Управление контейнерами разделов
document.querySelectorAll('.sections-container').forEach(c => c.classList.remove('active'));
document.getElementById(sections-mod${modNum}).classList.add('active');
// Прячем рабочую карточку и возвращаем приветствие, если модуль пустой/сменился
document.getElementById('trainer-card').classList.remove('active');
document.getElementById('welcome-screen').classList.remove('hidden');
// Снимаем выделение с кнопок разделов
document.querySelectorAll('.sec-btn').forEach(btn => btn.classList.remove('active'));
}
// Запуск конкретного подраздела (Уровень 2)
function startSection(sectionId) {
document.getElementById('welcome-screen').classList.add('hidden');
document.getElementById('trainer-card').classList.add('active');
// Визуально подсвечиваем активный раздел
document.querySelectorAll('.sec-btn').forEach(btn => btn.classList.remove('active'));
if (sectionId === 'adjectives') {
document.getElementById('sec-btn-adj').classList.add('active');
// Клонируем базу вопросов и перемешиваем её случайным образом
currentQuestions = [...adjectivesQuestions].sort(() => Math.random() - 0.5);
}
currentQuestionIndex = 0;
score = 0;
renderQuestion();
}
// Отображение текущего вопроса открытого типа
function renderQuestion() {
isAnswered = false;
const card = document.getElementById('trainer-card');
if (currentQuestionIndex >= currentQuestions.length) {
renderResults();
return;
}
const q = currentQuestions[currentQuestionIndex];
card.innerHTML = <div class="status-bar"> <span>Раздел: Прилагательные</span> <span>Вопрос ${currentQuestionIndex + 1} из ${currentQuestions.length}</span> <span>Счет: ${score}</span> </div> <div class="sentence-box"> ${q.text.replace('...',...)} <br><br> Слово-корень: <span class="word-badge">${q.word}</span> </div> <input type="text" id="open-input" class="input-answer" placeholder="Введите правильную форму..." onkeypress="handleKeyPress(event)" autocomplete="off"> <button id="submit-btn" class="action-btn" onclick="handleOpenAnswer()">Проверить ответ</button> <div id="feedback" class="feedback"></div> ;
document.getElementById('open-input').focus();
}
// Проверка введенного пользователем ответа
function handleOpenAnswer() {
if (isAnswered) return;
const input = document.getElementById('open-input');
const feedback = document.getElementById('feedback');
const userAnswer = input.value.trim().toLowerCase();
const q = currentQuestions[currentQuestionIndex];
// Очищаем правильный ответ от возможных пробелов и случайных символов
const correctAnswer = q.right.trim().toLowerCase();
if (!userAnswer) return; // Игнорируем пустые отправки
isAnswered = true;
if (userAnswer === correctAnswer) {
input.classList.add('correct');
feedback.className = "feedback correct";
feedback.innerText = "🎉 Отлично! Абсолютно верно.";
score++;
} else {
input.classList.add('wrong');
feedback.className = "feedback wrong";
feedback.innerText = ❌ Неверно. Правильный вариант: ${q.right};
}
// Превращаем кнопку проверки в кнопку перехода дальше
const btn = document.getElementById('submit-btn');
btn.innerText = "Следующий вопрос";
btn.onclick = nextQuestion;
}
// Обработка клавиши Enter для быстроты прохождения
function handleKeyPress(event) {
if (event.key === "Enter") {
if (!isAnswered) handleOpenAnswer();
else nextQuestion();
}
}
function nextQuestion() {
currentQuestionIndex++;
renderQuestion();
}
// Экран итогов раздела

const card = document.getElementById('trainer-card');
const percent = Math.round((score / currentQuestions.length) * 100);
